<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
</head>
<body bgcolor="#040b1c" style="margin:0; padding:0; background-color:#040b1c; font-family: Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#040b1c" style="background-color:#040b1c;">
    <tr>
        <td align="center" style="padding: 40px 20px;">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0" bgcolor="#08152e" style="background-color:#08152e; border-radius: 8px; max-width: 480px; width: 100%;">
                <tr>
                    <td style="padding: 40px 40px 20px 40px; text-align: center;">
                        <h1 style="color:#eaf2fb; font-size: 28px; font-weight: normal; margin: 0;">La&nbsp;Ta</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0 40px 20px 40px; color:#c7dcf0; font-size: 15px; line-height: 1.6;">
                        <p style="margin: 0 0 12px 0;">Welcome, <span th:text="${name}">friend</span>.</p>
                        <p style="margin: 0;">Your account is ready. Twelve seats, one table, roasted this week, gone when it's gone.</p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding: 10px 40px 40px 40px;">
                        <a th:href="${siteUrl}" style="background-color:#3aa0e0; color:#040b1c; text-decoration:none; padding: 14px 32px; border-radius: 4px; font-size: 15px; display: inline-block;">
                            Visit La Ta Coffee
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0 40px 30px 40px; color:#c7dcf0; font-size: 12px; opacity: 0.6;">
                        <p style="margin: 0;">Al-Tireh Street, Ramallah</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
