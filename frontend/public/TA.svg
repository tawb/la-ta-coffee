<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Background Circle (Dark Espresso) -->
  <circle cx="32" cy="32" r="30" fill="#24150E"/>
  
  <!-- Outer Ring Accent (Warm Gold/Caramel) -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#D4A373" stroke-width="1.5"/>

  <!-- Steam Lines -->
  <path d="M26 19 C24 16 27 14 25 11" fill="none" stroke="#FAEDCD" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 18 C30 15 33 13 31 10" fill="none" stroke="#FAEDCD" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 19 C36 16 39 14 37 11" fill="none" stroke="#FAEDCD" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Cup Body -->
  <path d="M20 23 H44 L42 37 C41.5 41 37 44 32 44 C27 44 22.5 41 22 37 Z" fill="#D4A373"/>

  <!-- Cup Handle -->
  <path d="M43 25 C48 25 49 34 42 36" fill="none" stroke="#D4A373" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monogram "TA" on Cup -->
  <text x="32" y="37" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#24150E" text-anchor="middle" letter-spacing="0.5">TA</text>

  <!-- Saucer Base -->
  <path d="M19 47 H45" stroke="#FAEDCD" stroke-width="2" stroke-linecap="round"/>
</svg>
