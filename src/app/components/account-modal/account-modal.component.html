<div class="scrim" [class.open]="modalService.activeModal() === 'account'" (click)="modalService.close()"></div>

<div class="modal auth" [class.open]="modalService.activeModal() === 'account'">
  <div class="modal__in">
    <div class="modal__top">
      <div>
        <h3>Your account</h3>
        <p>Guest — not signed in</p>
      </div>
      <button class="mx" (click)="modalService.close()">Close</button>
    </div>

    <div class="acct">
      <button class="acct__row" (click)="modalService.open('login')">
        <span>Log in</span><span class="cta__x">→</span>
      </button>
      <button class="acct__row" (click)="modalService.open('signup')">
        <span>Create an account</span><span class="cta__x">→</span>
      </button>
      <button class="acct__row" (click)="modalService.open('reserve')">
        <span>My reservations</span><span class="cta__x">→</span>
      </button>
      <button class="acct__row" (click)="modalService.open('order')">
        <span>Order history</span><span class="cta__x">→</span>
      </button>
    </div>
  </div>
</div>
