<section class="hero" [class.on]="heroOn()" [style.background-color]="current().bg" id="top" #heroSection>
  <div class="hero__field" [style.background-color]="current().bg"></div>
  <div class="hero__vig"></div>

  <div class="hero__stage">
    <h1 class="hero__wm" [style.color]="current().wm"><span>LA</span><span>TA</span></h1>
    <div class="hero__glow" #glowEl></div>

    <div class="hero__drinks">
        <!--index is a special built in variable Angular automatically provides inside any for loop-->
      @for (drink of drinks; track drink.name; let i = $index) {
        <div
          class="drink-slice"
          [class.live]="i === currentIndex()"
          [class.out]="i !== currentIndex()"
          [style.background-position-x]="(i / (drinks.length - 1)) * 100 + '%'">
        </div>
      }
    </div>
    <div class="hero__plate"></div>
  </div>

  <div class="hero__cap">
    <div class="hero__name">
      <span [class.swap]="swapping()">{{ displayed().name }}</span>
    </div>
    <div class="hero__note" [class.swap]="swapping()">{{ displayed().note }}</div>
  </div>

  <div class="hero__dots">
    @for (drink of drinks; track drink.name; let i = $index) {
        <!--[attr.x], for setting a genuine HTML attribute-->
      <i [class.on]="i === currentIndex()" (click)="goTo(i)" [attr.aria-label]="'Show ' + drink.name"></i>
    }
  </div>

  <p class="hero__tag">Seven cups. One table.</p>

  <div class="cue"><span>Scroll</span><span class="cue__l"></span></div>
</section>
