<div class="scrim" [class.open]="modalService.activeModal() === 'login'" (click)="modalService.close()"></div>

<div class="modal auth" [class.open]="modalService.activeModal() === 'login'">
  <div class="modal__in">
    <div class="modal__top">
      <div>
        <h3>Welcome back</h3>
        <p>Sign in to continue</p>
      </div>
      <button class="mx" (click)="modalService.close()">Close</button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="fields">
      <div class="f wide">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <span class="err">Enter a valid email</span>
        }
      </div>

      <div class="f wide">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <span class="err">Password must be at least 6 characters</span>
        }
      </div>

      <button type="submit" class="submit" [disabled]="loginForm.invalid">Log in</button>
      <p class="swap"><a (click)="modalService.open('reset')">Forgot password?</a></p>
    </form>
  </div>
</div>
