<label class="pick">
  <input
    type="checkbox"
    class="pick__input"
    [checked]="selected()"
    (change)="onToggle()"
  />
  <div class="pick__l">
    <span class="pick__b" [class.on]="selected()"></span>
    <span class="pick__n">{{ item().n }}</span>
  </div>
  <span class="pick__p">{{ item().p | price }}</span>
</label>
