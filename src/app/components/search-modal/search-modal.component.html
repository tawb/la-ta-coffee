<div class="scrim" [class.open]="modalService.activeModal() === 'search'" (click)="modalService.close()"></div>

<div class="modal search" [class.open]="modalService.activeModal() === 'search'">
  <div class="modal__in">
    <div class="modal__top">
      <div><h3>Search the list</h3></div>
      <button class="mx" (click)="modalService.close()">Close</button>
    </div>

    <div class="f wide">
      <input type="search" [formControl]="searchControl" placeholder="Try 'matcha', 'cold', 'espresso'..." style="font-size:1.2rem" />
    </div>

    <div class="results">
      @if (query() && filteredItems().length === 0) {
        <p class="res__empty">No matches for "{{ query() }}"</p>
      }
      @for (item of filteredItems(); track item.n) {
        <div class="res">
          <div>
            <b>{{ item.n }}</b><br>
            <span>{{ item.note }}</span>
          </div>
          <span class="res__p">₪{{ item.p }}</span>
        </div>
      }
    </div>
  </div>
</div>
